# ──────────────────────────────────────────────────────────────
# TraderX — Paper Trading Configuration
# ──────────────────────────────────────────────────────────────
# Adjust these values without touching core logic.

# Upstox API credentials (get from https://api.upstox.com/developer/apps)
upstox:
  api_key: ""        # Your Upstox API key (or set UPSTOX_API_KEY in .env)
  api_secret: ""     # Your Upstox API secret (or set UPSTOX_API_SECRET in .env)
  redirect_uri: "http://127.0.0.1:8000/callback"

# Strategy parameters
strategy:
  target_pct: 20.0          # Exit at +20% from entry
  stoploss_pct: 20.0        # Exit at -20% from entry
  hard_exit_time: "09:32"   # HH:MM IST — force close all open positions
  entry_window_start: "09:15"  # Earliest allowed entry (market open)
  max_positions: 3           # Number of simultaneous candidates

# ── Stock Picker / Scanner ──────────────────────────────────────
# All thresholds are tunable here. Do NOT hardcode them in stock_picker.py.
scanner:
  # ── Stage 1: Candidate Pool (pre-open, 9:00-9:15) ─────────────
  pool_size: 6                  # Top-N most-negative pre-open stocks to keep
  min_avg_oi_tier: "MED"        # Minimum liquidity tier: "HIGH" | "MED" | "LOW"
                                # Stocks with a tier below this are excluded.
                                # Tier order: HIGH > MED > LOW
  preopen_poll_interval_s: 120  # Poll pre-open LTP every N seconds for flip tracking
                                # Set to 0 to disable polling (Stage 2 flip check unavailable)

  # ── Stage 2: Structure Filter (9:15) ───────────────────────────
  gap_min_pct: 1.5              # Minimum gap-down % vs previous close (absolute value)
  gap_max_pct: 6.0              # Maximum gap-down % vs previous close (above = extended/circuit risk)
  max_preopen_flips: 2          # Reject if pre-open price direction changed > this many times
                                # (green→red counts as 1 flip, red→green→red = 2 flips)

  # ── Stage 3: Final Confirmation (9:16) ─────────────────────────
  top_n_losers_at_open: 3       # Stock must still be in top-N F&O losers at 9:16

  # ── Output & Logging ────────────────────────────────────────────
  scan_log_dir: "scan_log"      # Directory for JSONL audit logs (one file per day)
  fo_stocks_file: "fo_stocks.json"            # NSE F&O stock universe file
  corporate_actions_file: "corporate_actions.json"  # User-maintained flags file

  # ── Sector context ─────────────────────────────────────────────
  # Sector indices tracked for Stage 2 context notes.
  # These are surfaced as data points — not used to exclude stocks.
  sector_indices:
    - "NSE_INDEX|Nifty Bank"
    - "NSE_INDEX|Nifty IT"
    - "NSE_INDEX|Nifty Auto"
    - "NSE_INDEX|Nifty Energy"
    - "NSE_INDEX|Nifty Pharma"
    - "NSE_INDEX|Nifty Metal"
    - "NSE_INDEX|Nifty FMCG"
    - "NSE_INDEX|Nifty Realty"
    - "NSE_INDEX|Nifty PSU Bank"
    - "NSE_INDEX|Nifty Financial Services"

  # ── Backtesting ─────────────────────────────────────────────────
  backtest_universe: "HIGH"          # "HIGH" | "MED" | "HIGH+MED"
  backtest_pe_leverage_factor: 2.0   # Stock fall % * leverage = PE option gain %

  # ── Demo / dry-run mode ─────────────────────────────────────────
  # When true: feeds synthetic pre-open data through the full pipeline so
  # you can test the UI and all 3 stage filters outside 9:00-9:16 AM.
  # Set to false for live operation. NEVER auto-set from code.
  demo_mode: true

# Server
server:
  host: "127.0.0.1"
  port: 8000

# Database
database:
  path: "traderx.db"
