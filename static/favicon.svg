<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="txBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141C"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="txYellow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F5C518"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#F5C518" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="32" height="32" rx="7" fill="url(#txBg)"/>
  <rect x="1" y="1" width="30" height="30" rx="6" fill="none" stroke="#F5C518" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Candlestick / Bar accents -->
  <line x1="8" y1="17" x2="8" y2="24" stroke="#F5C518" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="14" y1="13" x2="14" y2="21" stroke="#F5C518" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Dynamic Momentum Trendline -->
  <path d="M6 21 L12 14.5 L17 18 L24 9.5" fill="none" stroke="url(#txYellow)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Peak Signal Node -->
  <circle cx="24" cy="9.5" r="2.8" fill="#F5C518" filter="url(#glow)"/>
</svg>
